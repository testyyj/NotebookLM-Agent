[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbagent"
version = "0.1.0"
description = "NotebookLM Agent — 可扩展 Skill 的命令行 Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "notebooklm-py[browser]",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
nbagent = "nbagent.cli:main"
