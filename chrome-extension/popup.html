<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <title>NotebookLM Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- ═══ Header ═══ -->
  <header id="header">
    <div class="logo">
      <span class="logo-icon">🤖</span>
      <span class="logo-text">NotebookLM Agent</span>
    </div>
    <div id="notebook-selector">
      <select id="active-notebook">
        <option value="">⏳ 加载中...</option>
      </select>
    </div>
  </header>

  <!-- ═══ Auth Error Banner ═══ -->
  <div id="auth-error" class="banner banner-error" style="display:none">
    ⚠️ 请先在浏览器中登录 <a href="https://notebooklm.google.com" target="_blank">NotebookLM</a>
  </div>

  <!-- ═══ Tab Navigation ═══ -->
  <nav id="tabs">
    <button class="tab active" data-tab="notebooks">📒 笔记本</button>
    <button class="tab" data-tab="sources">📎 数据源</button>
    <button class="tab" data-tab="chat">💬 对话</button>
    <button class="tab" data-tab="generate">🎙️ 生成</button>
    <button class="tab" data-tab="artifacts">📥 制品</button>
  </nav>

  <!-- ═══ Tab Panels ═══ -->

  <!-- Notebooks -->
  <section id="panel-notebooks" class="panel active">
    <div class="panel-toolbar">
      <input type="text" id="new-nb-title" placeholder="新笔记本名称..." class="input-sm">
      <button id="btn-create-nb" class="btn btn-accent btn-sm">+ 创建</button>
    </div>
    <div id="notebook-list" class="card-list">
      <div class="loading-placeholder">加载中...</div>
    </div>
  </section>

  <!-- Sources -->
  <section id="panel-sources" class="panel">
    <div id="no-notebook-sources" class="empty-state" style="display:none">
      请先选择一个笔记本
    </div>
    <div class="panel-toolbar">
      <input type="text" id="source-url" placeholder="输入 URL 添加数据源..." class="input-sm" style="flex:1">
      <button id="btn-add-source" class="btn btn-accent btn-sm">+ 添加</button>
    </div>
    <div id="source-list" class="card-list">
      <div class="empty-state">选择笔记本后显示数据源</div>
    </div>
  </section>

  <!-- Chat -->
  <section id="panel-chat" class="panel">
    <div id="chat-messages" class="chat-area">
      <div class="chat-welcome">
        <span class="chat-welcome-icon">💬</span>
        <p>向笔记本数据源提问</p>
      </div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="chat-input" placeholder="输入问题..." class="input-sm" style="flex:1">
      <button id="btn-send" class="btn btn-accent btn-sm">发送</button>
    </div>
  </section>

  <!-- Generate -->
  <section id="panel-generate" class="panel">
    <div id="no-notebook-gen" class="empty-state" style="display:none">
      请先选择一个笔记本
    </div>
    <div id="gen-grid" class="gen-grid">
      <button class="gen-btn" data-type="1">
        <span class="gen-icon">🎙️</span><span>播客</span>
      </button>
      <button class="gen-btn" data-type="3">
        <span class="gen-icon">🎬</span><span>视频</span>
      </button>
      <button class="gen-btn" data-type="4">
        <span class="gen-icon">❓</span><span>测验</span>
      </button>
      <button class="gen-btn" data-type="2">
        <span class="gen-icon">📝</span><span>报告</span>
      </button>
      <button class="gen-btn" data-type="8">
        <span class="gen-icon">📊</span><span>幻灯片</span>
      </button>
      <button class="gen-btn" data-type="5">
        <span class="gen-icon">🧠</span><span>思维导图</span>
      </button>
      <button class="gen-btn" data-type="7">
        <span class="gen-icon">🖼️</span><span>信息图</span>
      </button>
      <button class="gen-btn" data-type="9">
        <span class="gen-icon">📋</span><span>数据表</span>
      </button>
    </div>
    <div id="gen-status" class="gen-status" style="display:none">
      <div class="spinner"></div>
      <span id="gen-status-text">正在生成...</span>
    </div>
  </section>

  <!-- Artifacts -->
  <section id="panel-artifacts" class="panel">
    <div id="artifact-list" class="card-list">
      <div class="empty-state">选择笔记本后显示制品</div>
    </div>
  </section>

  <!-- ═══ Toast ═══ -->
  <div id="toast" class="toast" style="display:none"></div>

  <script src="popup.js" type="module"></script>
</body>
</html>
